<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Conexões Atlânticas - Constelação Acadêmica Interativa" />
  <title>Conexões Atlânticas · Constelação Acadêmica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── LEGENDA DE TIPOS DE DOCUMENTO ─────────────────────────────── */
    .doc-legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(6, 10, 18, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 18px;
      z-index: 100;
      max-width: 260px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .doc-legend h4 {
      margin: 0 0 10px 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255, 255, 255, 0.45);
    }
    .doc-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 8px;
      margin: 0 -8px;
      border-radius: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.75);
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .doc-legend-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .doc-legend-item.inactive {
      opacity: 0.35;
    }
    .doc-legend-item.active {
      background: rgba(255, 255, 255, 0.08);
    }
    .doc-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }
    .doc-legend-count {
      margin-left: auto;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      font-variant-numeric: tabular-nums;
      min-width: 20px;
      text-align: right;
    }

    /* ─── SIDEBAR ESTILIZADO ───────────────────────────────────────── */
    #sidebar {
      background: rgba(6, 10, 18, 0.94);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      overflow-y: auto;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #sidebar-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.35);
      font-size: 14px;
      line-height: 1.6;
    }
    #sidebar-empty .big-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.4;
    }
    .sidebar-detail {
      padding: 24px;
    }
    .sidebar-doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
      border: 1.5px solid currentColor;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(4px);
    }
    .sidebar-doc-badge .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
    }
    .sidebar-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: #e8ecf2;
      margin: 0 0 20px 0;
      letter-spacing: -0.01em;
    }
    .sidebar-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .meta-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .meta-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.35);
      min-width: 100px;
      flex-shrink: 0;
    }
    .meta-value {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.5;
    }
    .sidebar-keywords h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.35);
      margin: 0 0 12px 0;
    }
    .keyword-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .keyword-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s ease;
      cursor: default;
    }
    .keyword-tag:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.85);
    }
    .sidebar-actions {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: center;
    }
    .type-icon-large {
      font-size: 32px;
      opacity: 0.6;
      filter: drop-shadow(0 0 12px currentColor);
    }
    #sidebar::-webkit-scrollbar {
      width: 4px;
    }
    #sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    #sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    #sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="bg-gradient-animated"></div>

  <div id="app">
    <header id="topbar">
      <div class="logo">Conexões <span>Atlânticas</span></div>

      <div class="search-wrapper">
        <span class="icon" aria-hidden="true">⌕</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar título, autor, orientador..." 
          aria-label="Buscar artigos"
          autocomplete="off"
        />
      </div>

      <div class="filter-group">
        <span class="label">Período</span>
        <select id="period-filter" aria-label="Filtrar por período"></select>
      </div>

      <div class="filter-group">
        <span class="label">Temática</span>
        <select id="tematica-filter" aria-label="Filtrar por temática">
          <option value="all">Todas</option>
        </select>
      </div>

      <!-- 🎨 NOVO: Filtro por tipo de documento -->
      <div class="filter-group">
        <span class="label">Tipo</span>
        <select id="tipo-filter" aria-label="Filtrar por tipo de documento">
          <option value="all">Todos</option>
          <option value="dissertacao_tese">Dissertação/Tese</option>
          <option value="livro">Livro</option>
          <option value="capitulo_livro">Capítulo de livro</option>
          <option value="artigo_revista">Artigo de revista</option>
          <option value="referencia_bibliografica">Referência bibliográfica</option>
        </select>
      </div>
    </header>

    <main id="main">
      <div id="graph-container" role="img" aria-label="Constelação acadêmica interativa">
        <svg id="graph-svg"></svg>
        <div id="hint">🖱️ Passe o mouse · Clique para detalhes · Rolagem zoom · Escape fecha</div>

        <!-- 🎨 Legenda de cores por tipo -->
        <div class="doc-legend" id="doc-legend" aria-label="Legenda de tipos de documento">
          <h4>Tipos de documento</h4>
          <div class="doc-legend-item" data-type="dissertacao_tese">
            <span class="doc-legend-dot" style="background:#3B82F6;color:#3B82F6;"></span>
            <span>Dissertação/Tese</span>
            <span class="doc-legend-count" id="count-dissertacao_tese">0</span>
          </div>
          <div class="doc-legend-item" data-type="livro">
            <span class="doc-legend-dot" style="background:#D97706;color:#D97706;"></span>
            <span>Livro</span>
            <span class="doc-legend-count" id="count-livro">0</span>
          </div>
          <div class="doc-legend-item" data-type="capitulo_livro">
            <span class="doc-legend-dot" style="background:#EA580C;color:#EA580C;"></span>
            <span>Capítulo de livro</span>
            <span class="doc-legend-count" id="count-capitulo_livro">0</span>
          </div>
          <div class="doc-legend-item" data-type="artigo_revista">
            <span class="doc-legend-dot" style="background:#16A34A;color:#16A34A;"></span>
            <span>Artigo de revista</span>
            <span class="doc-legend-count" id="count-artigo_revista">0</span>
          </div>
          <div class="doc-legend-item" data-type="referencia_bibliografica">
            <span class="doc-legend-dot" style="background:#9CA3AF;color:#9CA3AF;"></span>
            <span>Referência bibliográfica</span>
            <span class="doc-legend-count" id="count-referencia_bibliografica">0</span>
          </div>
        </div>
      </div>

      <aside id="sidebar" aria-label="Painel de detalhes">
        <div class="empty-state" id="sidebar-empty">
          <div class="big-icon" aria-hidden="true">✦</div>
          <div>Selecione um nó na constelação<br />para ver os detalhes</div>
        </div>
        <div id="sidebar-content" style="display:none;"></div>
      </aside>
    </main>
  </div>

  <div id="tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
