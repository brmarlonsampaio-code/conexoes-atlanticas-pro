<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Conexões Atlânticas - Constelação Acadêmica Interativa" />
  <title>Conexões Atlânticas · Constelação Acadêmica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-gradient-animated"></div>

  <div id="app">
    <header id="topbar">
      <div class="logo">Conexões <span>Atlânticas</span></div>

      <div class="search-wrapper">
        <span class="icon" aria-hidden="true">⌕</span>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Buscar título, autor, orientador..." 
          aria-label="Buscar artigos"
          autocomplete="off"
        />
      </div>

      <div class="filter-group">
        <span class="label">Período</span>
        <select id="period-filter" aria-label="Filtrar por período"></select>
      </div>

      <div class="filter-group">
        <span class="label">Temática</span>
        <select id="tematica-filter" aria-label="Filtrar por temática">
          <option value="all">Todas</option>
        </select>
      </div>
    </header>

    <main id="main">
      <div id="graph-container" role="img" aria-label="Constelação acadêmica interativa">
        <svg id="graph-svg"></svg>
        <div id="hint">🖱️ Passe o mouse · Clique para detalhes · Rolagem zoom · Escape fecha</div>
      </div>

      <aside id="sidebar" aria-label="Painel de detalhes">
        <div class="empty-state" id="sidebar-empty">
          <div class="big-icon" aria-hidden="true">✦</div>
          <div>Selecione um nó na constelação<br />para ver os detalhes</div>
        </div>
        <div id="sidebar-content" style="display:none;"></div>
      </aside>
    </main>
  </div>

  <div id="tooltip" role="tooltip" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
